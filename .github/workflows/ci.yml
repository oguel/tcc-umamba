name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Quality (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies (when pyproject.toml exists)
        if: hashFiles('pyproject.toml') != ''
        run: uv sync
      - name: Ruff lint (src/tests)
        if: hashFiles('pyproject.toml') != ''
        run: uv run ruff check src tests
      - name: Ruff lint (runners oficiais)
        run: >-
          uv run ruff check scripts/audit_municipal_sources.py
          scripts/validate_emater_rgi.py scripts/train_emater_rgi.py scripts/smoke_umamba_gpu.py
          scripts/package_rgi_dataset.py scripts/preflight_training.py
          scripts/inspect_validation.py
          scripts/kaggle_validation_cell.py
      - name: Ruff format check (src/tests)
        if: hashFiles('pyproject.toml') != ''
        run: uv run ruff format --check src tests
      - name: Mypy (src/tests)
        if: hashFiles('pyproject.toml') != ''
        run: uv run mypy src tests
      - name: Pytest (src/tests)
        if: hashFiles('pyproject.toml') != ''
        run: uv run pytest tests
      - name: Smoke CPU (GeoTIFF sintetico 256 e 512 + augmentacao)
        run: |
          uv run python -m scripts.smoke_emater_rgi --synthetic --patch-size 256 --augment
          uv run python -m scripts.smoke_emater_rgi --synthetic --patch-size 512 --augment

  notebook-conventions:
    name: Notebook conventions (structure + clean outputs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate notebooks (naming, markdown-above-code, non-empty cells, no committed outputs)
        run: python .opencode/tools/scripts/check_notebook.py
