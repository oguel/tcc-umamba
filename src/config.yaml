# Fonte única de verdade de configuração do projeto.
project:
  name: "tcc-umamba"

aoi:
  region_code: "310044"  # Região Geográfica Imediata de Guaxupé (IBGE)
  vector_source: "ibge_mesh"
  mesh_path: "data/external/ibge/mg_rg_immediatas_2025/mg_rg_immediatas_2025.shp"

data:
  collection: "COPERNICUS/S2_SR_HARMONIZED"
  bands: ["B2", "B3", "B4", "B8"]
  dates:
    start: "2023-01-01"
    end: "2023-12-31"
  cloud_threshold: 20
  patch_size: 256
  coffee_min_ratio: 0.0
  crs: "EPSG:31983"
  export:
    scale: 10
    max_pixels: 100000000

ground_truth:
  # MapBiomas permanece como fonte inicial do pipeline geoespacial.
  # A qualidade das máscaras deverá ser validada e refinada antes do treinamento final.
  chosen_source: "mapbiomas"
  sources:
    mapbiomas:
      enabled: true
      collection_id: "projects/mapbiomas-public/assets/brazil/lulc/collection9/mapbiomas_collection90_integration_v1"
      coffee_class: 46
    alphaearth:
      enabled: false
      collection_id: "projects/forestdatapartnership/assets/coffee/model_2025a"
      probability_threshold: 0.95
    s2dr:
      enabled: false

gee:
  # Definir via variável de ambiente GEE_PROJECT ou preencher após criar o projeto no Google Cloud.
  project: null

storage:
  drive_root: "tcc"
  subfolders:
    data_raw: "data/raw"
    data_raw_sentinel2: "data/raw/sentinel2"
    data_interim: "data/interim"
    data_processed: "data/processed"
    data_processed_ground_truth: "data/processed/ground_truth"
    data_processed_composites: "data/processed/composites"
    data_processed_patches: "data/processed/patches"
    data_processed_patches_images: "data/processed/patches/images"
    data_processed_patches_masks: "data/processed/patches/masks"
    data_external: "data/external"
    data_embrapa: "data/embrapa"
    models: "models"
    models_unet: "models/unet"
    models_umamba: "models/umamba"
    artifacts_metrics: "artifacts/metrics"
    artifacts_metrics_ground_truth: "artifacts/metrics/ground_truth"
    artifacts_figures: "artifacts/figures"
    artifacts_runs: "artifacts/runs"
    secrets: "secrets"
    repo: "repo"

splits:
  fold_count: 5

loss:
  bce_weight: 1.0
  dice_weight: 1.0

model:
  unet_channels: [32, 64, 128, 256]
  input_channels_experimental: 3
  input_channels_sentinel2: 4
  output_channels: 1

training:
  lr: 1.0e-4
  epochs: 100
  batch_size: 2
  optimizer: "adamw"

reproducibility:
  seed: 42
