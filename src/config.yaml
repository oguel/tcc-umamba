# Fonte única de verdade. Campos data/ground_truth originais preservados APENAS para notebooks exploratórios.
project:
  name: "tcc-umamba"

aoi:
  region_code: "310044"  # Região Geográfica Imediata de Guaxupé (IBGE)
  vector_source: "ibge_mesh"
  mesh_path: "data/external/ibge/mg_rg_immediatas_2025/mg_rg_immediatas_2025.shp"

data:
  collection: "COPERNICUS/S2_SR_HARMONIZED"
  bands: ["B2", "B3", "B4", "B8"]
  dates:
    start: "2023-01-01"
    end: "2023-12-31"
  cloud_threshold: 20
  patch_size: 256  # legado; dataset definitivo EMATER usa patches 512x512 já fornecidos
  coffee_min_ratio: 0.0
  crs: "EPSG:31983"
  export:
    scale: 10
    max_pixels: 100000000

ground_truth:
  # MapBiomas é LEGADO, não deve ser usado como ground truth do treinamento oficial.
  # Ground truth do estudo definitivo: máscaras EMATER já incluídas no pacote Municipios.
  chosen_source: "mapbiomas"
  sources:
    mapbiomas:
      enabled: true
      collection_id: "projects/mapbiomas-public/assets/brazil/lulc/collection9/mapbiomas_collection90_integration_v1"
      coffee_class: 46
    alphaearth:
      enabled: false
      collection_id: "projects/forestdatapartnership/assets/coffee/model_2025a"
      probability_threshold: 0.95
    s2dr:
      enabled: false

gee:
  # Definir via variável de ambiente GEE_PROJECT ou preencher após criar o projeto no Google Cloud.
  project: null

storage:
  drive_root: "tcc"
  subfolders:
    data_raw: "data/raw"
    data_raw_sentinel2: "data/raw/sentinel2"
    data_interim: "data/interim"
    data_processed: "data/processed"
    data_processed_ground_truth: "data/processed/ground_truth"
    data_processed_composites: "data/processed/composites"
    data_processed_patches: "data/processed/patches"
    data_processed_patches_images: "data/processed/patches/images"
    data_processed_patches_masks: "data/processed/patches/masks"
    data_external: "data/external"
    data_embrapa: "imagens"  # Dataset experimental já existente em MyDrive/tcc/imagens
    models: "models"
    models_unet: "models/unet"
    models_umamba: "models/umamba"
    artifacts_metrics: "artifacts/metrics"
    artifacts_metrics_ground_truth: "artifacts/metrics/ground_truth"
    artifacts_figures: "artifacts/figures"
    artifacts_runs: "artifacts/runs"
    secrets: "secrets"
    repo: "repo"

splits:
  fold_count: 5

loss:
  bce_weight: 1.0
  dice_weight: 1.0

model:
  unet_channels: [32, 64, 128, 256]
  input_channels_experimental: 3
  input_channels_sentinel2: 4
  output_channels: 1
  umamba_features: [16, 32, 64, 128]

training:
  lr: 1.0e-4
  epochs: 100
  partial_epochs: 10
  umamba_partial_epochs: 3
  batch_size: 2
  umamba_batch_size: 1
  optimizer: "adamw"

reproducibility:
  seed: 42

# PROTOCOLO DEFINITIVO DO TCC (não substitui configurações de notebooks antigos)
official_dataset:
  aoi: "Regiao Geografica Imediata de Guaxupe (MG)"
  unit_of_analysis: "whole_rgi"
  source_root_drive: "00_DADOS_OFICIAIS_RGI_GUAXUPE"
  municipality_archives_dir: "00_DADOS_OFICIAIS_RGI_GUAXUPE/Municipios"
  scene_archives_dir: "00_DADOS_OFICIAIS_RGI_GUAXUPE/Cenas"
  patch_variant: "Patches_P512_S300_NN_Fora0_M0"
  patch_size: 512
  stride: 300
  mask_values:
    non_coffee: 0
    coffee: 1
    ignore: 255
  channels: 4
  band_indexes_rasterio: [1, 2, 3, 4] # confirmar ordem das bandas no metadado real
  optical_bands: ["B02", "B03", "B04", "B08"]
  radiometric_offset: -1000 # verificar por cena
  normalization: "sentinel2_dn_to_reflectance"
  crs_expected: "EPSG:32723"
  split:
    method: "spatial_block_purged"
    folds: 5
    block_size_m: 15000
    seed: 42
  execution: "portable" # mesmo codigo pode rodar local, Colab ou Kaggle com dependencias adequadas
  comparison_models: ["unet", "umamba"]
  independent_test_required: true
  sentinel2_future_inference: true
